name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install pinned official age source
        run: go install filippo.io/age/cmd/...@v1.3.2
      - name: Add Go tools to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: rainbow-fmt check --no-cache src tests
      - name: Test with real age
        run: python -m pytest -q --cov=seeqbox --cov-branch --cov-report=xml
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: thebjorn/seeqbox
          files: coverage.xml
          fail_ci_if_error: false
      - name: Build distributions
        run: python -m build
